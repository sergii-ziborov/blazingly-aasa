name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # A workflow that does not parse is registered by path, reports no triggers, and never runs.
      - name: Workflow files parse and declare triggers
        if: matrix.os == 'ubuntu-latest'
        run: pip install --quiet pyyaml && python3 scripts/check_workflows.py
      # The README quotes these outputs verbatim. If an example's output changes, the docs are
      # wrong from that commit on, and nobody notices until a reader runs the code.
      - name: Examples print what the README says they print
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check_examples.sh
      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
      # The MSRV job checks the library only: dev-dependencies (criterion, proptest) track a newer
      # toolchain than the crate itself needs to compile.
      - run: cargo check -p blazingly-aasa --lib

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p blazingly-aasa

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every fixture is valid JSON and is referenced by a test
        run: ./scripts/verify_fixtures.sh
