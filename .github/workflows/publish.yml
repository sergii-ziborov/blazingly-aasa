# Deliberately manual. `docs/parity.md` still marks behaviour as "decided by this crate" rather
# than checked against Apple's own tooling, and a version number on crates.io is permanent.
# Publish when that table is honest enough to stand behind, not on every push.
name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-crate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify the tag matches the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="blazingly-aasa") | .version')"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          }

      - name: Quality gate
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps --all-features

      - run: cargo publish -p blazingly-aasa --locked --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p blazingly-aasa --locked
